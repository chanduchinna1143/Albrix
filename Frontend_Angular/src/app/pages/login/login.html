<!-- TOAST -->
<div
  *ngIf="toastMessage"
  class="fixed top-6 right-6
         px-4 py-3 rounded-lg
         bg-white text-black
         border border-neutral-700
         shadow-lg
         z-[9999]">
  {{ toastMessage }}
</div>

<div class="min-h-screen flex items-center justify-center bg-black text-white">

  <div class="w-full max-w-md p-8 rounded-lg
              border border-neutral-700
              bg-neutral-900">

    <h2 class="text-2xl font-semibold mb-6 text-center">
      Login
    </h2>
    <input
      [(ngModel)]="email"
      type="email"
      placeholder="Email"
      class="w-full mb-4 px-4 py-2 rounded-lg bg-black text-white border border-neutral-700 placeholder-neutral-400 focus:outline-none focus:ring-1 focus:ring-white"
    />
    <input
      [(ngModel)]="password"
      type="password"
      placeholder="Password"
      class="w-full mb-6 px-4 py-2 rounded-lg bg-black text-white border border-neutral-700 placeholder-neutral-400 focus:outline-none focus:ring-1 focus:ring-white"
    />
    <button
      (click)="login()"
      [disabled]="loading"
      class="w-full py-2 rounded-lg bg-white text-black border border-neutral-600 transition disabled:opacity-50 disabled:cursor-not-allowed">
      {{ loading ? 'Logging in…' : 'Login' }}
    </button>
    <p class="mt-4 text-sm text-center text-neutral-400">
      Don’t have an account?
      <a
        routerLink="/signup"
        class="text-white underline hover:text-neutral-300 transition">
        Sign up
      </a>
    </p>

  </div>

</div>
