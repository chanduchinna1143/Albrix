<div class="flex flex-col h-screen bg-gray-100">
  <div class="bg-white shadow px-6 py-4 font-semibold text-lg">
    Albrix AI Chat
  </div>

  <div class="flex-1 overflow-y-auto p-6 space-y-4">
    <div
      *ngFor="let msg of messages"
      class="max-w-xl px-4 py-3 rounded-lg"
      [ngClass]="{
        'bg-blue-600 text-white ml-auto': msg.role === 'USER',
        'bg-gray-200 text-gray-900 mr-auto': msg.role === 'AI'
      }"
    >
      {{ msg.content }}
    </div>

    <div *ngIf="loading" class="text-gray-500 italic">
      AI is typing...
    </div>
  </div>

  <div class="bg-white p-4 flex gap-3">
    <input
      [(ngModel)]="prompt"
      (keydown.enter)="sendPrompt()"
      type="text"
      placeholder="Ask something..."
      class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
    />

    <button
      (click)="sendPrompt()"
      class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700"
    >
      Send
    </button>
  </div>

</div>
