<div class="flex h-screen bg-black text-white">
  <div class="w-64 bg-neutral-900 flex flex-col border-r border-neutral-700">

    <div class="px-4 py-4 text-lg font-semibold tracking-wide">
      Albrix AI
    </div>
    <button
      (click)="newChat()"
      class="mx-4 mb-3 px-4 py-2 rounded-lg bg-neutral-800 bg-white text-black transition">
      + New Chat (Requirments)
    </button>
    <div class="flex-1 overflow-y-auto">
      <div
        *ngFor="let chat of chatList"
        (click)="selectChat(chat.id)"
        class="px-4 py-3 cursor-pointer text-sm hover:bg-neutral-800 transition"
        [class.bg-neutral-800]="chat.id === chatId">
        {{ chat.title || 'New Chat' }}
      </div>
    </div>

  </div>
  <div class="flex-1 flex flex-col bg-black">
    <div class="flex justify-between items-center  px-6 py-4 border-b border-neutral-700 bg-black">
      <div class="font-semibold text-lg">
        Chat
      </div>
      <button
        (click)="logout()"
        class="px-4 py-1.5 text-sm rounded border border-neutral-600 bg-white text-black transition">
        Logout
      </button>
    </div>
    <div class="flex-1 overflow-y-auto px-6 py-6 space-y-5">
      <div
        *ngFor="let msg of messages"
        class="max-w-2xl px-4 py-3 rounded-lg text-sm border border-neutral-700"
        [ngClass]="{
          'ml-auto bg-neutral-900 text-white':
            msg.role === 'USER',
          'mr-auto bg-neutral-800 text-neutral-200':
            msg.role === 'AI'
        }"
      >
        <span *ngIf="msg.role === 'USER'">
          {{ msg.content }}
        </span>
        <pre
          *ngIf="msg.role === 'AI'"
          class="whitespace-pre-wrap font-mono text-xs text-neutral-300">
         {{ msg.content }}
        </pre>
      </div>
      <div #bottom></div>
      <div *ngIf="loading" class="text-xs italic text-neutral-400">
        AI is typing…
      </div>
    </div>
    <div class="px-6 py-4 border-t border-neutral-700 bg-black flex gap-3">

      <input
        [(ngModel)]="prompt"
        (keydown.enter)="sendPrompt()"
        type="text"
        placeholder="Ask something…"
        class="flex-1 px-4 py-2 rounded-lg bg-neutral-900 text-white border border-neutral-700 placeholder-neutral-400 focus:outline-none
               focus:ring-1 focus:ring-white"
      />
      <button
        (click)="sendPrompt()"
        class="px-6 py-2 rounded-lg border border-neutral-600 bg-white text-black transition">
        Send
      </button>

    </div>

  </div>

</div>
